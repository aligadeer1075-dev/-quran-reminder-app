name: Build Quran APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o QuranReminderApp-source.zip -d source

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranReminder-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
